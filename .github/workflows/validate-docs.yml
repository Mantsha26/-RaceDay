name: Validate RaceDay Documentation

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch: {}

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check docs folder and required files
        run: |
          set -eo pipefail

          if [ ! -d "docs" ]; then
            echo "ERROR: docs folder is missing."
            exit 1
          fi

          missing=0

          required_files=(
            "docs/Section A_RaceDay ERD.pdf"
            "docs/Section B API Endpoint Plan.pdf"
            "docs/RaceDayDB.sql"
          )

          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=1
            else
              echo "FOUND:  $f"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "One or more required planning documents are missing."
            exit 1
          fi

      - name: Success Message
        run: echo "All required planning documents are present."
