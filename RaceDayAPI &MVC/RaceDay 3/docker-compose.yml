# Start the MVC app with one command from the solution root:
#   docker compose up --build
# The API must already be running on the host (see README section 5).
services:
  raceday-mvc:
    build:
      context: .
      dockerfile: RaceDayMVC/Dockerfile
    image: raceday-mvc
    ports:
      - "8080:8080"
    environment:
      ApiSettings__BaseUrl: "${RACEDAY_API_URL:-https://host.docker.internal:56726/}"
      # The API's ASP.NET dev certificate is not trusted inside the container.
      # Local testing only: set to "false" and use a trusted certificate for real deployments.
      ApiSettings__AllowInvalidCertificate: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
