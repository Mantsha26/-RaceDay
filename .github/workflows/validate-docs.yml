name: Validate RaceDay Documentation

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check docs folder exists
        run: |
          if [ ! -d docs ]; then
            echo "docs folder is missing."
            exit 1
          fi

      - name: Check ERD exists
        run: |
          test -f "docs/Section A_RaceDay ERD.pdf"

      - name: Check API Endpoint Plan exists
        run: |
          test -f "docs/Section B API Endpoint Plan.pdf"

      - name: Check SQL Script exists
        run: |
          test -f "docs/RaceDayDB.sql"

      - name: Success Message
        run: echo "All required planning documents are present."
